[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf-dpo"
version = "0.1.0"
description = "End-to-end RLHF (PPO) and Direct Preference Optimization (DPO) alignment pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benjamin Chrepta" }]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
hf = ["transformers>=4.40", "peft>=0.11", "accelerate>=0.30"]

[project.scripts]
rlhf-dpo = "rlhf_dpo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
